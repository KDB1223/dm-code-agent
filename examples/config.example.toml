# Copy to dm-agent.toml in a workspace, or pass --config path/to/this/file.
# Precedence (low to high): built-in defaults, this file, environment variables, CLI flags.
# Put the API key in OPENAI_API_KEY. Do not commit a real key.

[agent]
max_steps = 20
# Relative paths are resolved against the workspace root.
log_dir = ".dm-agent/sessions"
shell_timeout_seconds = 30

[llm]
# "openai" means any OpenAI-compatible HTTP server, not only api.openai.com.
provider = "openai"
model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
temperature = 0.2
timeout_seconds = 120
# api_key = ""  # prefer the OPENAI_API_KEY environment variable
